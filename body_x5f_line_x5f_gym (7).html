html { scroll-behavior: smooth; }
body { background: #0a0a0a; color: #f5f5f5; font-family: 'Inter', system-ui, sans-serif; }
.font-display { font-family: 'Oswald', 'Inter', sans-serif; }
::selection { background: #e11d2e; color: #fff; }

section { scroll-margin-top: 76px; }

.reveal { opacity: 0; transform: translateY(30px); transition: opacity .8s cubic-bezier(.22,.61,.36,1), transform .8s cubic-bezier(.22,.61,.36,1); }
.reveal.revealed { opacity: 1; transform: none; }

@keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
@keyframes pulse-red { 0%,100% { box-shadow: 0 0 0 0 rgba(225,29,46,.45); } 50% { box-shadow: 0 0 0 14px rgba(225,29,46,0); } }
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@keyframes gridmove { from { background-position: 0 0; } to { background-position: 60px 60px; } }
@keyframes fadeSlide { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.testi-enter { animation: fadeSlide .5s cubic-bezier(.22,.61,.36,1) both; }

.animate-floaty { animation: floaty 5s ease-in-out infinite; }
.pulse-red { animation: pulse-red 2.2s ease-out infinite; }
.marquee-track { animation: marquee 28s linear infinite; }
.bg-grid-anim {
  background-image: linear-gradient(rgba(225,29,46,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(225,29,46,.07) 1px, transparent 1px);
  background-size: 60px 60px;
  animation: gridmove 8s linear infinite;
}
.text-stroke { -webkit-text-stroke: 1.5px rgba(255,255,255,.28); color: transparent; }
.hero-vignette { background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.75) 100%); }

input[type=range] { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 9999px; background: linear-gradient(90deg,#e11d2e var(--fill,50%), #262626 var(--fill,50%)); outline: none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 5px solid #e11d2e; cursor: pointer; box-shadow: 0 2px 10px rgba(225,29,46,.6); }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 5px solid #e11d2e; cursor: pointer; }
